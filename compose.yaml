name: noteblockstudio-web

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env to your website origin}
      HOST: 0.0.0.0
      PORT: '8765'
      HOSTED_ENABLE_TRANSCODE: ${HOSTED_ENABLE_TRANSCODE:-1}
      HOSTED_MAX_INPUT_MIB: ${HOSTED_MAX_INPUT_MIB:-128}
      HOSTED_MAX_OUTPUT_MIB: ${HOSTED_MAX_OUTPUT_MIB:-128}
      HOSTED_BODY_TIMEOUT_MS: ${HOSTED_BODY_TIMEOUT_MS:-20000}
      HOSTED_TRANSCODE_RATE: ${HOSTED_TRANSCODE_RATE:-30}
    ports:
      - '127.0.0.1:${APP_PORT:-8765}:8765'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=384m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 64
    stop_grace_period: 15s
