[package]
name = "nbs-dsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Note Block Studio sample mixer with independent SIMD FDN reverbs"

[lib]
name = "nbs_dsp"
crate-type = ["cdylib", "rlib"]

[features]
scalar = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
