name: CI

'on':
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '18'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Show runtime versions
        run: node --version
      # This source tree has no npm dependencies. Optional FFmpeg tests use the
      # runner's executable when present and skip themselves otherwise.
      - name: Run JavaScript and shipped-WASM tests
        run: npm test -- --test-concurrency=2

  rust-wasm:
    name: Rust / rebuilt SIMD and scalar WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Rust and bare WASM target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustc +stable --version
          cargo +stable --version
      - name: Test native Rust core without registry dependencies
        run: cargo +stable test --manifest-path rust/Cargo.toml --locked --offline --target-dir "$RUNNER_TEMP/nbs-dsp-host"
      - name: Build SIMD WASM without registry dependencies
        env:
          RUSTFLAGS: -C target-feature=+simd128
        run: cargo +stable build --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown --release --locked --offline --target-dir "$RUNNER_TEMP/nbs-dsp-simd"
      - name: Build independent scalar WASM
        env:
          RUSTFLAGS: -C target-feature=-simd128
        run: cargo +stable build --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown --release --features scalar --locked --offline --target-dir "$RUNNER_TEMP/nbs-dsp-scalar"
      - name: Compare public ABI with checked-in WASM
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import path from 'node:path';
          const builtPath = path.join(process.env.RUNNER_TEMP, 'nbs-dsp-simd/wasm32-unknown-unknown/release/nbs_dsp.wasm');
          const [shipped, built] = await Promise.all(['wasm/nbs_dsp.wasm', builtPath].map(async file => WebAssembly.compile(await readFile(file))));
          const shape = module => WebAssembly.Module.exports(module).filter(item => item.name === 'memory' || item.name.startsWith('engine_')).map(item => `${item.kind}:${item.name}`).sort();
          assert.deepEqual(shape(built), shape(shipped), 'Rust source and checked-in public WASM exports differ');
          assert.equal(WebAssembly.Module.imports(built).length, 0, 'DSP must not require host imports');
          const signatures = module => Object.entries(new WebAssembly.Instance(module, {}).exports).filter(([name, value]) => name.startsWith('engine_') && typeof value === 'function').map(([name, value]) => `${name}/${value.length}`).sort();
          assert.deepEqual(signatures(built), signatures(shipped), 'Public WASM argument counts differ');
          console.log(`Public ABI matches (${shape(built).length} exports); binary hashes need not match.`);
          NODE
      - name: Exercise rebuilt SIMD and scalar implementations
        run: |
          cp "$RUNNER_TEMP/nbs-dsp-simd/wasm32-unknown-unknown/release/nbs_dsp.wasm" wasm/nbs_dsp.wasm
          NBS_SCALAR_WASM="$RUNNER_TEMP/nbs-dsp-scalar/wasm32-unknown-unknown/release/nbs_dsp.wasm" node --test --test-concurrency=2 rust/tests/wasm-abi.test.mjs tests/dsp-pool.test.mjs

  hosted-container:
    name: Docker / website application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate production Compose and build hosted image
        env:
          PUBLIC_ORIGIN: https://nbs.example.com
        run: |
          docker compose config --quiet
          docker build --tag nbs-hosted:ci .
      - name: Test hosted services with the image FFmpeg
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=384m,mode=1777 --memory 1536m --cpus 2 --pids-limit 64 -v "$PWD/tests:/app/tests:ro" nbs-hosted:ci node --test --test-concurrency=2 tests/hosted-server.test.mjs tests/hosted-services.test.mjs tests/audio-resample.test.mjs tests/service-capabilities.test.mjs
      - name: Exercise the hosted application
        run: |
          docker run -d --name nbs-hosted-ci-app -p 127.0.0.1:18880:8765 --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=384m,mode=1777 --memory 1536m --cpus 2 --pids-limit 64 -e PUBLIC_ORIGIN=http://localhost:18880 nbs-hosted:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:18880/api/health >/dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-hosted.mjs http://localhost:18880 --all-formats
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker logs nbs-hosted-ci-app 2>&1 || true
      - name: Remove the temporary container
        if: always()
        run: |
          docker rm -f nbs-hosted-ci-app 2>/dev/null || true
